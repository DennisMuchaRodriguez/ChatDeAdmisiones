<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat de Admisión</title>
  <meta name="description" content="Asistente virtual que responde sobre vacantes, pensiones, horarios y requisitos, y registra los datos de contacto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Barra solo para mostrar la demo a prospectos. Se oculta con ?limpio=1 o en modo widget. -->
  <nav class="barra-demo" id="barraDemo" aria-label="Opciones de la demo"></nav>

  <main class="pagina">
    <section class="info" id="info"></section>

    <section class="chat" aria-label="Chat con el asistente virtual">
      <header class="chat-cabecera">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="chat-titulo">
          <strong id="nombreAsistente"></strong>
          <span><i class="punto"></i><span id="rolAsistente"></span> · en línea</span>
        </div>
        <button class="btn-icono" id="reiniciar" type="button" title="Nueva conversación" aria-label="Nueva conversación">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </header>

      <div class="mensajes" id="mensajes" aria-live="polite"></div>
      <div class="sugerencias" id="sugerencias"></div>

      <form class="entrada" id="formulario" autocomplete="off">
        <input id="entrada" type="text" placeholder="Escriba su consulta…" maxlength="300" aria-label="Mensaje">
        <button id="enviar" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
        </button>
      </form>
      <div class="pie-chat">Asistente virtual · responde 24/7</div>
    </section>
  </main>

  <!-- Configuración de cada cliente (agrega aquí los nuevos) -->
  <script src="js/configs/colegio.js"></script>
  <script src="js/configs/academia.js"></script>
  <script src="js/configs/clinica.js"></script>
  <!-- Motor del chat e interfaz -->
  <script src="js/bot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
